name: Veille parking Massy
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        type: boolean
        default: true
concurrency:
  group: veille-parking
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright requests && playwright install --with-deps chromium
      - run: python veille.py
        env:
          TEST: ${{ inputs.test }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: capture.png
          retention-days: 2
          if-no-files-found: ignore
